<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oy Search</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oy Search">
<meta name="theme-color" content="#4a2a73">
<style>
:root{--bg:#efecf3;--card:#fff;--ink:#1c1726;--mut:#675f75;--line:#dad4e3;--acc:#4a2a73;--ok:#1f7a4d;--okbg:#e0f2e8;--warn:#9a5200;--warnbg:#fdeccf;--nabg:#e9e5ef}
@media(prefers-color-scheme:dark){:root{--bg:#131018;--card:#1d1925;--ink:#ece8f2;--mut:#a398b3;--line:#2f2839;--acc:#c7a9f0;--ok:#7fd3a3;--okbg:#17372a;--warn:#f1b266;--warnbg:#3d2a10;--nabg:#272031}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:680px;margin:0 auto;padding:16px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:2}
h1{font-size:19px;line-height:1.3;margin:6px 0 0;color:var(--acc)}
input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;cursor:pointer}
#status{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:13px;margin-top:8px;min-height:20px}
#refresh{background:none;border:0;color:var(--acc);font-size:13px;padding:0}
#tabs{display:flex;gap:6px;margin-top:10px}
#tabs button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut);font-weight:600}
#tabs button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
.card,.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.word{font:600 34px/1.2 "Frank Ruhl Libre","David","Times New Roman",serif;direction:rtl;text-align:right;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
dl{display:grid;grid-template-columns:7.5rem 1fr;gap:6px 12px;margin:0}
dt{color:var(--mut);font-size:14px}
dd{margin:0;overflow-wrap:anywhere}
.empty{color:var(--mut)}
.der{color:var(--mut)}
.sub{color:var(--mut);font-size:13px;margin:10px 0 0}
.sec{font-weight:700;font-size:14px;margin:12px 0 6px;color:var(--mut);letter-spacing:.02em}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:14px;font-weight:600;background:var(--nabg);color:var(--ink)}
.msg{text-align:center;color:var(--mut);padding:32px 8px}
#more{display:block;margin:4px auto 24px;padding:10px 20px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--acc)}
button.rulelink{background:none;border:0;padding:0;font:inherit;color:var(--acc);text-decoration:underline;text-align:start}
.he{direction:rtl;unicode-bidi:isolate}
.tw{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px;text-align:start;vertical-align:top}
th{background:var(--nabg)}
@media(max-width:520px){main{padding:12px 8px}table{font-size:14px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);font:18px "Frank Ruhl Libre","David",serif;direction:rtl}
.gb{margin-top:10px;padding:8px 14px;border:1px solid var(--acc);border-radius:8px;background:var(--card);color:var(--acc);font-size:14px;font-weight:600}
.gt{font-weight:700;margin:0 0 4px}
.pre{white-space:pre-line;overflow-wrap:anywhere}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
@media(min-width:600px){.ov{align-items:center}}
.modal{position:relative;background:var(--card);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px 18px 20px;margin-bottom:8px}
.modal h3{margin:0 38px 12px 0;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.x{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:50%;background:var(--nabg);color:var(--ink);font-size:22px;line-height:1;padding:0}
.rl{color:var(--mut);font-size:13px;margin:10px 0 2px}
#tools{display:flex;gap:20px;justify-content:center;padding:8px 0 0}
#tools button{background:none;border:0;color:var(--acc);font-size:13px;padding:4px}
#credit{color:var(--mut);font-size:12px;text-align:center;padding:8px 0 28px}
</style>
</head>
<body>
<main>
<h1>Oy Search: the <span class="he" lang="yi">וי</span> vowel by dialect</h1>
<header>
<input id="q" type="search" dir="auto" lang="yi" placeholder="Search a Yiddish word…" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
<div id="status"><span id="count"></span><button id="refresh" type="button">Refresh data</button></div>
<nav id="tabs"><button type="button" data-v="search" class="on">Search</button><button type="button" data-v="groups">Groups</button><button type="button" data-v="pairs">Pairs</button></nav>
</header>
<div id="results"></div>
<button id="more" type="button" hidden>Show more</button>
<div id="groups" hidden></div>
<div id="pairs" hidden></div>
<footer id="tools"><button type="button" id="exp">Export data</button><button type="button" id="imp">Import data</button><input type="file" id="impfile" accept=".json,application/json" hidden></footer>
<p id="credit">Based on “Oy!: a self-directed guide to the <span class="he">וי</span> vowel for dialect-aspirers,” compiled by Arele Schaechter Viswanath.</p>
</main>
<script>
const SHEET_ID='1grJ0TvZI_2iYKaEJSq0gU-Qs_hvHi7Rg8uP_sz8Rk0M';
const url=n=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${n}`;
const CACHE_KEY='oy-lookup-v1',PAGE=50,DIALS=[['Klal','Klal (Standard)'],['NEY','NEY (Northeastern)'],['CY','CY (Central)'],['SEY','SEY (Southeastern)']];
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

// ---- storage
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('oy-lookup',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

// ---- parsing
function parseCSV(t){const out=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
  else if(c=='\n'){r.push(f);out.push(r);r=[];f=''}else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);out.push(r)}return out}
const norm=s=>(s||'').normalize('NFD').replace(/[\u0591-\u05C7]/g,'').replace(/\u05F0/g,'וו').replace(/\u05F1/g,'וי').replace(/\u05F2/g,'יי').replace(/[\s\-()…]/g,'').toLowerCase();
function table(csv){const t=parseCSV(csv),head=t[0].map(h=>h.trim().toLowerCase());
 return {head:t[0].map(h=>h.trim()),rows:t.slice(1).filter(r=>r.some(c=>c.trim())),col:n=>head.indexOf(n)}}
function buildWords(csv){const T=table(csv),g=n=>T.col(n);
 const keys=['word','gloss','component','group','klal','ney','cy','sey','hint','notes'],ix={};keys.forEach(k=>ix[k]=g(k));
 return T.rows.filter(r=>(r[ix.word]||'').trim()).map(r=>{const o={};keys.forEach(k=>o[k]=ix[k]>=0?(r[ix[k]]||'').trim():'');
  o.group=o.group.toLowerCase();o.nw=norm(o.word);o.ng=norm(o.gloss);o.np=[o.klal,o.ney,o.cy,o.sey].map(norm).join('|');return o})}
function buildRules(csv){const T=table(csv),c=n=>T.col(n);
 return T.rows.map(r=>({code:(r[c('code')]||'').trim().toLowerCase(),name:(r[c('rule')]||'').trim(),when:(r[c('applies when')]||'').trim(),pron:(r[c('pronunciation')]||'').trim()})).filter(r=>r.name)}
function buildPairs(csv){const T=table(csv);return {head:T.head,rows:T.rows}}

let words=[],rules=[],pairs={head:[],rows:[]},matches=[],shown=0;
const ruleFor=code=>code?rules.find(r=>r.code===code):null;
function parseDial(t){const re=/\b(Klal|NEY|CY|SEY|SY)\s*:/g;let m;const pos=[];
 while((m=re.exec(t)))pos.push([m[1],m.index,re.lastIndex]);if(!pos.length)return null;
 const o={};pos.forEach((p,i)=>{const v=t.slice(p[2],i+1<pos.length?pos[i+1][1]:t.length).trim().replace(/[.;]\s*$/,'');
  if(p[0]==='SY'){o.CY=o.CY||v;o.SEY=o.SEY||v}else o[p[0]]=v});return o}

// ---- loading
function setStatus(m){$('count').textContent=m}
async function load(force){
 if(!force){try{const c=await idbGet(CACHE_KEY);if(c&&c.words){({words,rules,pairs}=c);setStatus(`${words.length} words (saved ${new Date(c.at).toLocaleDateString()})`);render()}}catch(e){}}
 try{
  setStatus(words.length?'Updating…':'Loading data…');
  const get=async n=>{const r=await fetch(url(n));if(!r.ok)throw new Error(r.status);const t=await r.text();if(t.trim().startsWith('<'))throw new Error('Sheet is not public');return t};
  const [a,b,c]=await Promise.all([get('Oy'),get('Rules'),get('MinimalPairs')]);
  words=buildWords(a);rules=buildRules(b);pairs=buildPairs(c);
  try{await idbSet(CACHE_KEY,{at:Date.now(),words,rules,pairs})}catch(e){}
  setStatus(`${words.length} words · up to date`);render();
 }catch(e){setStatus(words.length?`Offline — using saved data (${words.length} words)`:'Could not load the spreadsheet. Check that it is shared as “Anyone with the link can view”.')}}
function render(){search();drawGroups();drawPairs()}

// ---- search
function search(){
 const raw=$('q').value.trim(),q=norm(raw),R=$('results');
 if(!q){matches=[];R.innerHTML=words.length?'<p class="msg">Type a Yiddish word to search. Partial matches are included. English glosses and Latin forms like <i>oykh</i> work too.</p>':'';$('more').hidden=true;return}
 const latin=/[a-z]/i.test(raw),m=[];
 for(const w of words){let best=-1,len=0;
  const tryKey=s=>{if(!s)return;const p=s.indexOf(q);if(p<0)return;const sc=s===q?0:p===0?1:2;if(best<0||sc<best){best=sc;len=s.length}};
  if(latin){tryKey(w.ng);tryKey(w.np)}else tryKey(w.nw);
  if(best>=0)m.push([best,len,w])}
 m.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);matches=m.map(x=>x[2]);shown=0;R.innerHTML='';
 if(!matches.length){noMatch(raw,q);$('more').hidden=true;return}
 more()}
function more(){const f=document.createDocumentFragment();
 for(const w of matches.slice(shown,shown+PAGE))f.append(card(w));
 shown=Math.min(shown+PAGE,matches.length);$('results').append(f);
 $('more').hidden=shown>=matches.length;$('more').textContent=`Show more (${matches.length-shown} left)`}
function noMatch(raw,q){const R=$('results');R.append(el('p','msg','No matches.'));
 if(/[a-z]/i.test(raw)||!q.includes('וי')||!ruleFor('2'))return;
 const r=ruleFor('2'),c=el('article','card');
 c.append(el('div','gt','Not in the lists'));
 c.append(el('p',null,'Group 1 is close to exhaustive and Groups 4 and 5 are small, so a word with וי that is in none of them most likely follows Group 2.'));
 const b=el('button','rulelink',r.name);b.type='button';b.onclick=()=>showRule(r);c.append(b);
 const d=parseDial(r.pron);if(d)c.append(dialBlock(d,{}));
 c.append(el('p','sub','This is the guide’s general pattern, not a lookup result. Check the word in a dictionary if it matters.'));R.append(c)}

function dialBlock(der,own){
 const dl=el('dl');let any=false;
 for(const [k,label] of DIALS){const k2=k.toLowerCase(),mine=own[k2]||'',d=der&&der[k]||'',v=mine||d;
  dl.append(el('dt',null,label));const dd=el('dd',mine?null:v?'der':'empty',v||'—');dd.dir='auto';dl.append(dd);if(v)any=true}
 return any?dl:null}
function card(w){
 const c=el('article','card'),h=el('h2','word',w.word);h.lang='yi';c.append(h);
 const dl=el('dl'),row=(l,v,node)=>{dl.append(el('dt',null,l));const d=el('dd');if(node)d.append(node);else if(v){d.textContent=v}else{d.className='empty';d.textContent='—'}dl.append(d)};
 row('Gloss',w.gloss);row('Component',w.component);
 const r=ruleFor(w.group);
 if(r){const b=el('button','rulelink',`Group ${w.group}`);b.type='button';b.onclick=()=>showRule(r);row('Group',null,b)}else row('Group',w.group);
 if(w.hint){const s=el('span','he',w.hint);s.lang='yi';row('Hint',null,s)}
 c.append(dl);
 const der=r?parseDial(r.pron):null,own={klal:w.klal,ney:w.ney,cy:w.cy,sey:w.sey},hasOwn=Object.values(own).some(Boolean),db=dialBlock(der,own);
 if(db){c.append(el('div','sec','Pronunciation by dialect'));c.append(db);
  if(der&&!hasOwn)c.append(el('p','sub','Values come from the group’s rule.'))}
 else if(r&&r.pron){c.append(el('div','sec','Pronunciation'));c.append(el('div','pre',r.pron))}
 if(w.notes){c.append(el('div','sec','Notes'));c.append(el('div','pre',w.notes))}
 return c}

// ---- rule modal
function showRule(r){
 const ov=el('div','ov'),m=el('div','modal'),x=el('button','x','×');x.type='button';x.setAttribute('aria-label','Close');
 const close=()=>ov.remove();x.onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
 m.append(x,el('h3',null,r.name));
 if(r.when){m.append(el('div','rl','Applies when'),el('div','pre',r.when))}
 if(r.pron){m.append(el('div','rl','Pronunciation'));const d=parseDial(r.pron),b=d&&dialBlock(d,{});if(b)m.append(b);else m.append(el('div','pre',r.pron))}
 if(r.code&&words.some(w=>w.group===r.code)){const b=el('button','gb','See the words in this group');b.type='button';b.onclick=()=>{close();setView('groups');const t=document.querySelector(`[data-code="${r.code}"] .gb`);if(t){t.click();t.scrollIntoView({block:'start'})}};m.append(b)}
 ov.append(m);document.body.append(ov)}

// ---- tabs: groups, pairs
function drawGroups(){const G=$('groups');G.innerHTML='';
 if(!rules.length){G.append(el('p','msg','No data yet.'));return}
 for(const r of rules){const n=el('div','note');if(r.code)n.dataset.code=r.code;
  n.append(el('div','gt',r.name));
  if(r.when)n.append(el('div','pre',r.when));
  if(r.pron){n.append(el('div','rl','Pronunciation'));const d=parseDial(r.pron),b=d&&dialBlock(d,{});if(b)n.append(b);else n.append(el('div','pre',r.pron))}
  const ws=r.code?words.filter(w=>w.group===r.code):[];
  if(ws.length){const b=el('button','gb',`Show words (${ws.length})`);b.type='button';const chips=el('div','chips');chips.hidden=true;
   b.onclick=()=>{if(!chips.childElementCount)for(const w of ws){const c=el('button','chip',w.word);c.type='button';c.lang='yi';c.onclick=()=>{$('q').value=w.word;setView('search');search();scrollTo(0,0)};chips.append(c)}
    chips.hidden=!chips.hidden;b.textContent=(chips.hidden?'Show':'Hide')+` words (${ws.length})`};
   n.append(b,chips)}
  G.append(n)}}
function drawPairs(){const P=$('pairs');P.innerHTML='';
 if(!pairs.rows.length){P.append(el('p','msg','No data yet.'));return}
 P.append(el('p','sub','Minimal and near-minimal pairs: Group 1 (U4) vs. Group 2 (cholam).'));
 const w=el('div','tw'),t=el('table'),hr=el('tr');
 for(const h of pairs.head)hr.append(el('th',null,h));t.append(hr);
 for(const r of pairs.rows){const tr=el('tr');pairs.head.forEach((_,i)=>{const td=el('td',null,r[i]||'');if(/[\u0590-\u05FF]/.test(r[i]||'')){td.className='he';td.lang='yi'}tr.append(td)});t.append(tr)}
 w.append(t);P.append(w)}
function setView(v){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 $('results').hidden=v!=='search';$('more').hidden=v!=='search'||shown>=matches.length;$('groups').hidden=v!=='groups';$('pairs').hidden=v!=='pairs'}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('q').addEventListener('input',()=>{setView('search');search()});
$('more').onclick=more;$('refresh').onclick=()=>load(true);
// ---- export / import
$('exp').onclick=()=>{
 if(!words.length){setStatus('Nothing to export yet.');return}
 const data={app:'oy-search',version:1,exported:new Date().toISOString(),words,rules,pairs};
 const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=el('a');
 a.href=URL.createObjectURL(blob);a.download=`oy-search-${new Date().toISOString().slice(0,10)}.json`;
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
 setStatus(`Exported ${words.length} words.`)};
$('imp').onclick=()=>$('impfile').click();
$('impfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  const j=JSON.parse(await f.text());
  if(j.app!=='oy-search'||!Array.isArray(j.words)||!j.words.every(w=>w&&typeof w.word==='string')||!Array.isArray(j.rules)||!j.pairs||!Array.isArray(j.pairs.rows))throw new Error('not an Oy Search export');
  words=j.words.map(w=>({...w,nw:norm(w.word),ng:norm(w.gloss||''),np:[w.klal,w.ney,w.cy,w.sey].map(norm).join('|')}));
  rules=j.rules;pairs={head:j.pairs.head||[],rows:j.pairs.rows};
  try{await idbSet(CACHE_KEY,{at:Date.now(),words,rules,pairs})}catch(_){}
  setStatus(`${words.length} words (imported)`);render();
 }catch(err){setStatus('Import failed: '+err.message)}};

load(false);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
